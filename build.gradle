plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
repositories { mavenCentral() }
loom {
    accessWidenerPath = file("src/main/resources/oreandorder.classtweaker")
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand 'version': modVersion }
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'oreandorder_test'
        enableGameTests = true
        enableClientGameTests = true
    }
}
tasks.register('integrationTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.oreandorder.PlannerTests'
    jvmArgs '--add-modules=jdk.httpserver'
}
tasks.named('test') { enabled = false }
check.dependsOn integrationTest
tasks.register('livePlannerTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.oreandorder.LivePlannerTest'
}
